    <radialGradient id="glow"><stop stop-color="#9979ee" stop-opacity=".25"/><stop offset="1" stop-color="#9979ee" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#c0b1f2" stroke-opacity=".045"/></pattern>
  </defs>
