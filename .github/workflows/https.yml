name: Managed HTTPS

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-https:
    name: Ubuntu / public HTTPS and owned port migration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Prepare the disposable Ubuntu host
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d /run/systemd/system
          for directory in /opt /mnt; do
            test -d "$directory"
            test ! -L "$directory"
            test "$(stat -c '%u' -- "$directory")" = 0
            sudo chmod 0755 -- "$directory"
          done
          PUBLIC_IP=''
          for provider in https://api.ipify.org https://checkip.amazonaws.com; do
            if candidate=$(curl --ipv4 --proto '=https' --tlsv1.2 --fail --silent --show-error --connect-timeout 5 --max-time 15 "$provider") &&
              python3 -I -B -c 'import ipaddress,sys; value=ipaddress.ip_address(sys.argv[1]); assert value.version == 4 and value.is_global and str(value) == sys.argv[1]' "$candidate"; then
              PUBLIC_IP=$candidate
              break
            fi
          done
          test -n "$PUBLIC_IP"
          printf 'PUBLIC_IP=%s\n' "$PUBLIC_IP" >> "$GITHUB_ENV"
      - name: Install fresh public HTTPS with the production installer
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          if ! sudo env PATH=/usr/sbin:/usr/bin:/sbin:/bin bash deploy/install.sh \
            --root-mode --self-signed --public-ip "$PUBLIC_IP" --no-network-tuning \
            > "$RUNNER_TEMP/vortex-https-fresh.log" 2>&1; then
            echo 'Fresh managed HTTPS installation failed.' >&2
            sed -E 's/(One-time setup token:|SETUP TOKEN:).*/\1 [redacted]/' "$RUNNER_TEMP/vortex-https-fresh.log" | tail -n 100 >&2
            exit 1
          fi
          sudo systemctl is-active --quiet vortex-panel.service
          sudo systemctl is-active --quiet nginx.service
      - name: Verify TLS, sessions, proxy headers and owned migrations
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          PANEL_PID=$(sudo systemctl show vortex-panel.service --property=MainPID --value)
          [[ $PANEL_PID =~ ^[1-9][0-9]*$ ]]
          PANEL_NODE=$(sudo readlink -f "/proc/$PANEL_PID/exe")
          sudo "$PANEL_NODE" --input-type=module - "$PUBLIC_IP" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import http from 'node:http';
          import https from 'node:https';
          import tls from 'node:tls';
          import net from 'node:net';
          import {createHash, randomBytes, X509Certificate} from 'node:crypto';
          import {execFileSync, spawnSync} from 'node:child_process';
          import {createRequire} from 'node:module';
          import {setTimeout as delay} from 'node:timers/promises';
          const [ip,source,temporary]=process.argv.slice(2);
          assert.equal(net.isIP(ip),4);
          assert.equal(process.platform,'linux');
          const require=createRequire('/opt/vortex-panel/current/package.json');
          const {WebSocket}=require('ws');
          const certFile='/etc/vortex-panel/tls/ip.crt',keyFile='/etc/vortex-panel/tls/ip.key';
          const environment='/etc/vortex-panel.env',receiptFile='/etc/vortex-panel/access.json',proxyFile='/etc/nginx/conf.d/vortex-panel.conf';
          const captureFile='/run/vortex-install-ledger-panel.json',resumeFile='/run/vortex-install-ledger-panel-resume.json';
          const sha=value=>createHash('sha256').update(value).digest('hex');
          function assertAbsent(file){assert.throws(()=>fs.lstatSync(file),error=>error.code==='ENOENT','Unexpected preserved installer evidence.');}
          function reviewedCapture(){
            const info=fs.lstatSync(captureFile);assert.ok(info.isFile()&&info.uid===0&&info.nlink===1&&(info.mode&0o777)===0o600&&info.size>0&&info.size<16*1024*1024,'The expected private installer baseline is not trusted.');assertAbsent(resumeFile);
            const bytes=fs.readFileSync(captureFile),value=JSON.parse(bytes);assert.equal(value.schemaVersion,1);assert.equal(value.role,'panel');assert.equal(value.freshInstall,false);const fingerprint=sha(bytes);
            const validation=JSON.parse(command('/usr/bin/python3',['-I','-B',path.join(source,'deploy/install-ledger.py'),'validate-capture','--role','panel','--capture-sha256',fingerprint]));assert.equal(validation.ok,true);assert.equal(validation.captureSHA256,fingerprint);return fingerprint;
          }
          const sensitive=new Set();
          function diagnostics(label,text){let safe=String(text||'');for(const value of sensitive)if(value)safe=safe.replaceAll(value,'[redacted]');const lines=safe.split('\n').slice(-80).map(line=>/(?:setup token|password|authorization|set-cookie|csrf|session token)/i.test(line)?'[redacted credential-related diagnostic line]':line);console.error('Bounded diagnostics: '+label+'\n'+lines.join('\n'));}
          function command(file,args,timeout=30000){try{return execFileSync(file,args,{encoding:'utf8',timeout,maxBuffer:2*1024*1024});}catch(error){diagnostics(path.basename(file),error.stderr);throw Error('A fixed HTTPS verification command failed: '+path.basename(file));}}
          const pid=()=>command('/usr/bin/systemctl',['show','vortex-panel.service','--property=MainPID','--value']).trim();
          const origin=port=>'https://'+ip+(port===443?'':':'+port);
          function snapshot(){
            const values={};for(const line of fs.readFileSync(environment,'utf8').split('\n'))if(/^(HOST|PORT|PUBLIC_URL|TRUST_PROXY)=/.test(line)){const index=line.indexOf('=');assert.ok(!(line.slice(0,index) in values),'Duplicate access setting.');values[line.slice(0,index)]=line.slice(index+1).replace(/^"|"$/g,'');}
            const receipt=JSON.parse(fs.readFileSync(receiptFile,'utf8'));
            let generation=null;try{generation=fs.readlinkSync('/etc/vortex-panel/tls-managed/active');}catch(error){assert.equal(error.code,'ENOENT');}
            return {values,receipt,certificate:sha(fs.readFileSync(certFile)),key:sha(fs.readFileSync(keyFile)),generation,environment:sha(fs.readFileSync(environment)),proxy:sha(fs.readFileSync(proxyFile)),receiptBytes:sha(fs.readFileSync(receiptFile)),pid:pid()};
          }
          function request(port,route,{method='GET',headers={},body}={}){
            return new Promise((resolve,reject)=>{
              const payload=body===undefined?null:Buffer.from(JSON.stringify(body));
              const req=https.request({hostname:'127.0.0.1',port,path:route,method,agent:false,ca:fs.readFileSync(certFile),checkServerIdentity:(_host,certificate)=>tls.checkServerIdentity(ip,certificate),headers:{Host:ip+(port===443?'':':'+port),...(payload?{'Content-Type':'application/json','Content-Length':payload.length}:{}),...headers}},response=>{
                if(!response.socket.authorized){response.destroy();reject(Error('The served TLS certificate was not trusted.'));return;}
                const fingerprint=sha(response.socket.getPeerCertificate().raw);let content='',bytes=0;
                response.on('data',chunk=>{bytes+=chunk.length;if(bytes>1024*1024){response.destroy();reject(Error('HTTPS response exceeded its bound.'));}else content+=chunk;});
                response.on('end',()=>resolve({status:response.statusCode,headers:response.headers,content,fingerprint}));response.on('error',reject);
              });req.setTimeout(10000,()=>req.destroy(Error('HTTPS request timeout.')));req.on('error',reject);if(payload)req.write(payload);req.end();
            });
          }
          async function assertRedirect(port){
            const result=await new Promise((resolve,reject)=>{const req=http.get({hostname:'127.0.0.1',port:80,path:'/https-audit?query=1',headers:{Host:ip}},response=>{response.resume();response.on('end',()=>resolve({status:response.statusCode,location:response.headers.location}));});req.setTimeout(10000,()=>req.destroy(Error('HTTP redirect timeout.')));req.on('error',reject);});
            assert.equal(result.status,308);assert.equal(result.location,origin(port)+'/https-audit?query=1');
          }
          async function assertPortClosed(port){
            for(let attempt=0;attempt<20;attempt++){if(command('/usr/bin/ss',['-H','-ltnp','( sport = :'+port+' )']).trim()==='')return;await delay(250);}throw Error('The retired HTTPS port is still listening.');
          }
          async function waitReady(port){
            for(let attempt=0;attempt<40;attempt++){try{const result=await request(port,'/healthz');if(result.status===200&&String(JSON.parse(result.content).processId)===pid())return;}catch{}await delay(250);}throw Error('The restored panel did not become ready.');
          }
          const baseline=snapshot();
          const baselineFingerprint=new X509Certificate(fs.readFileSync(certFile)).fingerprint256.replaceAll(':','').toLowerCase();
          function assertIdentity(current){assert.equal(current.certificate,baseline.certificate,'Certificate bytes changed during a port migration.');assert.equal(current.key,baseline.key,'Private key bytes changed during a port migration.');assert.equal(current.receipt.id,baseline.receipt.id,'The owned access identity changed.');assert.equal(current.receipt.createdAt,baseline.receipt.createdAt,'Certificate receipt generation changed.');assert.equal(current.generation,baseline.generation,'Active certificate generation changed.');}
          async function assertState(port,label){
            const current=snapshot();assertIdentity(current);assert.equal(current.values.HOST,'127.0.0.1');assert.equal(current.values.PORT,'3000');assert.equal(current.values.TRUST_PROXY,'1');assert.equal(current.values.PUBLIC_URL,origin(port));assert.equal(current.receipt.url,origin(port));assert.equal(current.receipt.publicPort??443,port);
            const health=await request(port,'/healthz');assert.equal(health.status,200);assert.equal(health.fingerprint,baselineFingerprint);const value=JSON.parse(health.content);assert.equal(value.service,'vortex-panel');assert.equal(String(value.processId),current.pid);await assertRedirect(port);
            const inspection=JSON.parse(command('/usr/bin/python3',['-I','-B','/opt/vortex-panel/current/server/host-tls.py','inspect']));assert.equal(inspection.ok,true);assert.equal(inspection.tls.mode,'self-signed');assert.equal(inspection.tls.publicPort,port);assert.equal(inspection.tls.automaticRenewal,false);
            const verification=JSON.parse(command('/usr/bin/python3',['-I','-B','-c',"import importlib.util,json; s=importlib.util.spec_from_file_location('owned_tls','/opt/vortex-panel/current/server/host-tls.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); t=m.TLSManager(); address,backend=t.identity(); cert=t.certificate('/etc/vortex-panel/tls/ip.crt',address); t.tls_health(address,cert['fingerprint'],'/etc/vortex-panel/tls/ip.crt'); print(json.dumps({'publicPort':t.public_port,'backend':backend,'generation':t.active_generation()}))"]));assert.equal(verification.publicPort,port);assert.equal(verification.backend,3000);assert.equal(verification.generation,baseline.generation);
            console.log(JSON.stringify({stage:label,publicPort:port,backendPort:3000,servedFingerprint:health.fingerprint,certificatePreserved:true,renewalVerificationPort:verification.publicPort}));
          }
          async function assertForwardedHeaders(port){
            command('/usr/bin/systemctl',['stop','vortex-panel.service']);let echo;
            try{
              echo=http.createServer((req,res)=>{res.setHeader('Content-Type','application/json');res.end(JSON.stringify({host:req.headers.host,proto:req.headers['x-forwarded-proto']}));});await new Promise((resolve,reject)=>{echo.once('error',reject);echo.listen(3000,'127.0.0.1',resolve);});
              const result=await request(port,'/private-proxy-header-probe',{headers:{'X-Forwarded-Proto':'http'}});assert.equal(result.status,200);const value=JSON.parse(result.content);assert.equal(value.host,ip+(port===443?'':':'+port));assert.equal(value.proto,'https');
            }finally{if(echo?.listening)await new Promise(resolve=>echo.close(resolve));command('/usr/bin/systemctl',['start','vortex-panel.service']);}
            await waitReady(port);
          }
          const password=randomBytes(32).toString('base64url'),username='https-audit';
          sensitive.add(password);
          async function websocket(port,cookie,allowed){
            await new Promise((resolve,reject)=>{
              const socket=new WebSocket('wss://127.0.0.1:'+port+'/ws',{ca:fs.readFileSync(certFile),checkServerIdentity:(_host,certificate)=>tls.checkServerIdentity(ip,certificate),headers:{Host:ip+(port===443?'':':'+port),Origin:allowed?origin(port):origin(port===19191?19192:444),Cookie:cookie}});
              const timer=setTimeout(()=>finish(Error('TLS WebSocket timed out.')),10000);let settled=false;
              function finish(error){if(settled)return;settled=true;clearTimeout(timer);socket.terminate();error?reject(error):resolve();}
              socket.on('error',error=>{if(allowed)finish(Error('TLS WebSocket failed.'));else if(!settled)finish(error);});
              socket.on('unexpected-response',(_req,response)=>{response.resume();if(!allowed&&response.statusCode===401)finish();else finish(Error('WebSocket origin enforcement failed.'));});
              socket.on('message',data=>{try{assert.equal(allowed,true);assert.equal(JSON.parse(data).type,'update');finish();}catch{finish(Error('WebSocket readiness failed.'));}});
            });
          }
          async function assertAuthentication(port,first=false){
            let result;
            if(first){const current=pid(),invocation=command('/usr/bin/systemctl',['show','vortex-panel.service','--property=InvocationID','--value']).trim();const journal=command('/usr/bin/journalctl',['-b','-u','vortex-panel.service','_PID='+current,'_SYSTEMD_INVOCATION_ID='+invocation,'-n','100','--no-pager','-o','cat']);const token=[...journal.matchAll(/^SETUP TOKEN: ([A-Za-z0-9_-]{20,128})$/gm)].at(-1)?.[1];assert.ok(token,'The fresh panel setup token was not available.');sensitive.add(token);result=await request(port,'/api/auth/setup',{method:'POST',headers:{Origin:origin(port)},body:{token,username,password}});}
            else result=await request(port,'/api/auth/login',{method:'POST',headers:{Origin:origin(port)},body:{username,password}});
            assert.equal(result.status,200);const value=JSON.parse(result.content);assert.equal(value.authenticated,true);const raw=(result.headers['set-cookie']||[]).find(row=>row.startsWith('bedrock.sid='));assert.ok(typeof raw==='string'&&/; Secure/i.test(raw)&&/; HttpOnly/i.test(raw)&&/; SameSite=Strict/i.test(raw),'Session cookie security flags are missing.');const cookie=raw.split(';')[0],headers={Origin:origin(port),Cookie:cookie,'X-CSRF-Token':value.csrfToken};assert.ok(value.csrfToken);sensitive.add(value.csrfToken);sensitive.add(cookie.slice(cookie.indexOf('=')+1));
            const denied=await request(port,'/api/auth/logout',{method:'POST',headers:{...headers,Origin:origin(port===19191?19192:444)},body:{}});assert.equal(denied.status,403);
            const badCsrf=await request(port,'/api/auth/logout',{method:'POST',headers:{...headers,'X-CSRF-Token':'incorrect-private-probe'},body:{}});assert.equal(badCsrf.status,403);
            await websocket(port,cookie,true);await websocket(port,cookie,false);
            const signedOut=await request(port,'/api/auth/logout',{method:'POST',headers,body:{}});assert.equal(signedOut.status,200);
            console.log(JSON.stringify({stage:'authenticated-https',publicPort:port,cookieAndCsrfPassed:true,webSocketPassed:true,accountPreserved:!first}));
          }
          function install(label,port,allowFailure=false,resumeLedger=''){
            assert.ok(resumeLedger===''||/^[a-f0-9]{64}$/.test(resumeLedger));
            const args=[path.join(source,'deploy/install.sh'),'--self-signed','--no-network-tuning',...(port===undefined?[]:['--public-port',String(port)]),...(resumeLedger?['--resume-ledger',resumeLedger]:[])];
            const result=spawnSync('/usr/bin/bash',args,{encoding:'utf8',timeout:20*60*1000,maxBuffer:16*1024*1024,env:{PATH:'/usr/sbin:/usr/bin:/sbin:/bin',HOME:'/root',LANG:'C',LC_ALL:'C'}});fs.writeFileSync(path.join(temporary,'vortex-https-'+label+'.log'),String(result.stdout||'')+String(result.stderr||''),{mode:0o600});
            if(result.error||!allowFailure&&result.status!==0){diagnostics(label,String(result.stdout||'')+String(result.stderr||''));throw Error('The installer did not complete; its private log was retained.');}return result.status;
          }
          async function assertInjectedRollback(){
            const before=snapshot();
            const program=[
              'import importlib.util,json',
              "s=importlib.util.spec_from_file_location('owned_access','/opt/vortex-panel/current/deploy/configure-access.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m)",
              "real=m.Runner(); state={'injected':False,'restored':False}",
              'def run(args,**kwargs):',
              "    if args==['systemctl','reload','nginx'] and not state['injected']:",
              "        state['injected']=True",
              "        raise m.AccessError('Injected disposable-runner reload failure')",
              '    return real(args,**kwargs)',
              'setup=m.AccessSetup(run=run); plan=setup.upgrade_plan(443)',
              "assert plan['action']=='migrate' and plan['fromPublicPort']==19191",
              'try: setup.apply_upgrade(plan)',
              'except m.AccessError as error:',
              "    assert state['injected'] and 'the previous endpoint was restored' in str(error)",
              "    state['restored']=True",
              "assert state['restored']",
              'print(json.dumps(state))',
            ].join('\n');
            const result=JSON.parse(command('/usr/bin/python3',['-I','-B','-c',program],60000));assert.equal(result.injected,true);assert.equal(result.restored,true);
            const after=snapshot();for(const key of ['environment','proxy','receiptBytes'])assert.equal(after[key],before[key],'Rollback changed an original access file.');assertIdentity(after);await assertPortClosed(443);await assertState(19191,'injected-reload-failure-restored');
          }
          const {assertAvailablePanelPorts}=await import('file:///opt/vortex-panel/current/server/safety.js');
          for(const kind of ['nodejs','python']){assert.throws(()=>assertAvailablePanelPorts({kind,port:19191},[19191]),error=>error.status===409);assert.doesNotThrow(()=>assertAvailablePanelPorts({kind,port:19191},[]));}
          assert.doesNotThrow(()=>assertAvailablePanelPorts({port:19191,portV6:19192,transport:'raknet'},[19191]));
          assert.throws(()=>assertAvailablePanelPorts({port:19132,portV6:19133,transport:'raknet',debugPort:19191},[19191]),error=>error.status===409);
          await assertState(19191,'fresh-default');await assertPortClosed(443);await assertForwardedHeaders(19191);await assertAuthentication(19191,true);
          assertAbsent(captureFile);assertAbsent(resumeFile);
          const beforeConflict=snapshot();const blocker=net.createServer();await new Promise((resolve,reject)=>{blocker.once('error',reject);blocker.listen(443,'0.0.0.0',resolve);});
          try{assert.notEqual(install('conflict',443,true),0,'A foreign target listener was overwritten.');const after=snapshot();for(const key of ['environment','proxy','receiptBytes','pid'])assert.equal(after[key],beforeConflict[key],'Conflict detection changed an existing component.');assertIdentity(after);}finally{await new Promise(resolve=>blocker.close(resolve));}
          const reviewedCaptureSHA=reviewedCapture(),beforeRetry=snapshot();
          assert.notEqual(install('pending-baseline',443,true),0,'An ordinary retry overwrote preserved installer evidence.');assert.ok(fs.readFileSync(path.join(temporary,'vortex-https-pending-baseline.log'),'utf8').includes('A previous installer baseline exists.'));assert.equal(reviewedCapture(),reviewedCaptureSHA);const afterRetry=snapshot();for(const key of ['environment','proxy','receiptBytes','pid'])assert.equal(afterRetry[key],beforeRetry[key],'A refused retry changed an existing component.');assertIdentity(afterRetry);
          await assertState(19191,'conflict-preserved');
          await assertInjectedRollback();
          assert.equal(reviewedCapture(),reviewedCaptureSHA);
          install('to-443',443,false,reviewedCaptureSHA);assertAbsent(captureFile);assertAbsent(resumeFile);await assertState(443,'explicit-legacy-port');await assertPortClosed(19191);await assertAuthentication(443);
          install('ordinary-preserve');await assertState(443,'ordinary-upgrade-preserves-443');await assertAuthentication(443);
          install('to-19191',19191);await assertState(19191,'explicit-public-port');await assertPortClosed(443);await assertForwardedHeaders(19191);await assertAuthentication(19191);
          assertAbsent(captureFile);assertAbsent(resumeFile);
          console.log(JSON.stringify({passed:true,freshDefault:19191,legacy443Preserved:true,ownedRoundTripPassed:true,listenerConflictPreserved:true,reviewedBaselineRecoveryPassed:true,injectedReloadRollbackPassed:true,backendUnchanged:3000,automaticCertificateIssuance:false,externalReachabilityClaimed:false}));
          NODE
      - name: Bounded public service diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo systemctl show vortex-panel.service nginx.service --property=ActiveState --property=SubState --property=Result --property=MainPID
          sudo nginx -t
