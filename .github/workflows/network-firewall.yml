name: Native firewall

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-firewall:
    name: Ubuntu / isolated native firewall / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Prepare namespace tools and unpack persistence packages without installing services
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(node -p 'process.arch')" = '${{ matrix.arch }}'
          sudo apt-get -o DPkg::Lock::Timeout=120 update
          sudo apt-get -o DPkg::Lock::Timeout=120 install --no-install-recommends -y iptables iproute2 python3
          mkdir -m 0700 "$RUNNER_TEMP/vortex-firewall-packages"
          cd "$RUNNER_TEMP/vortex-firewall-packages"
          apt-get download netfilter-persistent iptables-persistent
      - name: Exercise scoped live rules, persistence and cleanup in isolated network namespaces
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -Eeuo pipefail
          umask 077
          NODE_BIN=$(command -v node)
          SOURCE_ROOT=$(pwd -P)
          BASE=/run/vortex-firewall-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${EXPECTED_ARCH}
          SERVER_NS=vortex-fw-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${EXPECTED_ARCH}-s
          CLIENT_NS=vortex-fw-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${EXPECTED_ARCH}-c
          RESTORE_NS=vortex-fw-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${EXPECTED_ARCH}-r
          SERVER_CREATED=false
          CLIENT_CREATED=false
          RESTORE_CREATED=false
          SERVER_IDENTITY=
          CLIENT_IDENTITY=
          RESTORE_IDENTITY=
          test ! -e "$BASE"
          sudo install -d -m 0700 "$BASE" "$BASE/root"
          cat > "$RUNNER_TEMP/vortex-firewall-host-snapshot.py" <<'PY'
          import hashlib, json, os, re, stat, subprocess, sys
          result = {}
          for name in ('iptables-save', 'ip6tables-save'):
              value = subprocess.run(['/usr/sbin/' + name, '-t', 'filter'], capture_output=True, text=True, check=True, timeout=8).stdout
              lines = [re.sub(r' \[[0-9]+:[0-9]+\]$', ' [0:0]', line) for line in value.splitlines() if line and not line.startswith('#')]
              result[name] = hashlib.sha256('\n'.join(lines).encode()).hexdigest()
          result['service'] = subprocess.run(['/usr/bin/systemctl', 'show', 'netfilter-persistent.service', '--property=LoadState,ActiveState,SubState,UnitFileState'], capture_output=True, text=True, timeout=8).stdout
          for filename in ('/etc/iptables/rules.v4', '/etc/iptables/rules.v6'):
              if not os.path.lexists(filename):
                  result[filename] = None
                  continue
              info = os.lstat(filename)
              value = {'mode': info.st_mode, 'uid': info.st_uid, 'gid': info.st_gid, 'ino': info.st_ino, 'bytes': info.st_size}
              if stat.S_ISREG(info.st_mode):
                  assert info.st_size <= 4 * 1024 * 1024
                  with open(filename, 'rb') as stream:
                      value['sha256'] = hashlib.sha256(stream.read()).hexdigest()
              elif stat.S_ISLNK(info.st_mode):
                  value['link'] = os.readlink(filename)
              result[filename] = value
          with open(sys.argv[1], 'x') as stream:
              json.dump(result, stream, sort_keys=True)
          PY
          sudo python3 -I -B "$RUNNER_TEMP/vortex-firewall-host-snapshot.py" "$BASE/host-before.json"
          cat > "$RUNNER_TEMP/vortex-firewall-netns-cleanup.py" <<'PY'
          import os, re, signal, subprocess, sys
          name = sys.argv[1]
          assert re.fullmatch(r'vortex-fw-[A-Za-z0-9-]{1,100}', name)
          assert hasattr(os, 'pidfd_open') and hasattr(signal, 'pidfd_send_signal')
          assert re.fullmatch(r'[0-9]+:[1-9][0-9]*', sys.argv[2])
          expected = tuple(map(int, sys.argv[2].split(':')))
          namespace = '/run/netns/' + name
          namespace_fd = os.open(namespace, os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW)
          try:
              identity = os.fstat(namespace_fd)
              assert (identity.st_dev, identity.st_ino) == expected
              result = subprocess.run(['/usr/sbin/ip', 'netns', 'pids', name], capture_output=True, text=True, check=True, timeout=8)
              assert len(result.stdout) <= 1024 * 1024
              rows = result.stdout.splitlines()
              assert len(rows) <= 4096 and all(re.fullmatch(r'[1-9][0-9]{0,9}', row) for row in rows)
              for value in set(rows):
                  try:
                      process_fd = os.pidfd_open(int(value), 0)
                  except ProcessLookupError:
                      continue
                  try:
                      # Open the PID handle first: a recycled numeric PID must
                      # never redirect the signal to an unrelated process.
                      current_namespace = os.stat(namespace)
                      assert (current_namespace.st_dev, current_namespace.st_ino) == expected
                      try:
                          process_namespace = os.stat('/proc/' + value + '/ns/net')
                      except FileNotFoundError:
                          continue
                      if (process_namespace.st_dev, process_namespace.st_ino) != expected:
                          continue
                      try:
                          signal.pidfd_send_signal(process_fd, signal.SIGKILL, None, 0)
                      except ProcessLookupError:
                          pass
                  finally:
                      os.close(process_fd)
              current_namespace = os.stat(namespace)
              assert (current_namespace.st_dev, current_namespace.st_ino) == expected
          finally:
              os.close(namespace_fd)
          PY
          cleanup() {
            local result=$?
            trap - EXIT
            set +e
            for pair in "$RESTORE_CREATED:$RESTORE_NS:$RESTORE_IDENTITY" "$CLIENT_CREATED:$CLIENT_NS:$CLIENT_IDENTITY" "$SERVER_CREATED:$SERVER_NS:$SERVER_IDENTITY"; do
              if [[ ${pair%%:*} == true ]]; then
                namespace_and_identity=${pair#*:}
                namespace=${namespace_and_identity%%:*}
                namespace_identity=${namespace_and_identity#*:}
                if sudo python3 -I -B "$RUNNER_TEMP/vortex-firewall-netns-cleanup.py" "$namespace" "$namespace_identity"; then
                  sudo ip netns delete "$namespace" || result=1
                else
                  echo "Namespace cleanup could not be verified: $namespace" >&2
                  result=1
                fi
              fi
            done
            sudo python3 -I -B "$RUNNER_TEMP/vortex-firewall-host-snapshot.py" "$BASE/host-after.json" || result=1
            sudo cmp -s "$BASE/host-before.json" "$BASE/host-after.json" || { echo 'Host firewall rules, persistent files or service state changed.' >&2; result=1; }
            if [[ $result == 0 ]]; then echo 'Host firewall rules, persistent files and service state remained unchanged.'; fi
            exit "$result"
          }
          trap cleanup EXIT
          for package in "$RUNNER_TEMP/vortex-firewall-packages/"*.deb; do
            sudo dpkg-deb --extract "$package" "$BASE/root"
          done
          sudo install -d -m 0755 "$BASE/root/run" "$BASE/root/etc/iptables" "$BASE/root/var/lib/vortex-firewall-ci"
          sudo chown -R root:root "$BASE"
          sudo ip netns add "$SERVER_NS"
          SERVER_CREATED=true
          SERVER_IDENTITY=$(sudo stat -Lc '%d:%i' "/run/netns/$SERVER_NS")
          sudo ip netns add "$CLIENT_NS"
          CLIENT_CREATED=true
          CLIENT_IDENTITY=$(sudo stat -Lc '%d:%i' "/run/netns/$CLIENT_NS")
          sudo ip netns add "$RESTORE_NS"
          RESTORE_CREATED=true
          RESTORE_IDENTITY=$(sudo stat -Lc '%d:%i' "/run/netns/$RESTORE_NS")
          sudo ip -n "$SERVER_NS" link set lo up
          sudo ip -n "$CLIENT_NS" link set lo up
          sudo ip netns exec "$SERVER_NS" ip link add fw-server type veth peer name fw-client
          sudo ip -n "$SERVER_NS" link set fw-client netns "$CLIENT_NS"
          sudo ip -n "$SERVER_NS" address add 10.248.0.1/30 dev fw-server
          sudo ip -n "$CLIENT_NS" address add 10.248.0.2/30 dev fw-client
          sudo ip -n "$SERVER_NS" -6 address add fd76:6f72:7465:7800::1/64 dev fw-server nodad
          sudo ip -n "$CLIENT_NS" -6 address add fd76:6f72:7465:7800::2/64 dev fw-client nodad
          sudo ip -n "$SERVER_NS" link set fw-server up
          sudo ip -n "$CLIENT_NS" link set fw-client up
          for tool in iptables ip6tables; do
            sudo ip netns exec "$SERVER_NS" /usr/sbin/$tool -w 5 -A INPUT -i lo -j ACCEPT
            sudo ip netns exec "$SERVER_NS" /usr/sbin/$tool -w 5 -A INPUT -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
            sudo ip netns exec "$SERVER_NS" /usr/sbin/$tool -w 5 -A INPUT -p tcp --dport 22 -m comment --comment provider-ssh -j ACCEPT
          done
          for tool in iptables ip6tables; do
            sudo ip netns exec "$SERVER_NS" /usr/sbin/$tool -w 5 -A INPUT -p tcp --dport 28599 -m comment --comment vortex:ffffffffffffffff:68b42799-ad39-43ac-9b9a-1da7be025eed -j ACCEPT
          done
          sudo ip netns exec "$SERVER_NS" /usr/sbin/ip6tables -w 5 -A INPUT -p ipv6-icmp -j ACCEPT
          sudo ip netns exec "$SERVER_NS" /usr/sbin/iptables -w 5 -A INPUT -j REJECT --reject-with icmp-host-prohibited
          sudo ip netns exec "$SERVER_NS" /usr/sbin/ip6tables -w 5 -A INPUT -j REJECT --reject-with icmp6-adm-prohibited
          sudo ip netns exec "$SERVER_NS" /usr/sbin/iptables-save | sudo tee "$BASE/root/etc/iptables/rules.v4" > /dev/null
          sudo ip netns exec "$SERVER_NS" /usr/sbin/ip6tables-save | sudo tee "$BASE/root/etc/iptables/rules.v6" > /dev/null
          sudo chmod 0644 "$BASE/root/etc/iptables/rules.v4" "$BASE/root/etc/iptables/rules.v6"
          cat > "$RUNNER_TEMP/vortex-firewall-bounded-proof.py" <<'PY'
          """Linux proof of production native command limits; no firewall writes."""
          import importlib.util,json,os,pathlib,sys,tempfile,time
          spec=importlib.util.spec_from_file_location('vortex_bounded_proof',pathlib.Path(sys.argv[1]).resolve());m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          assert sys.platform=='linux'
          checks=0
          
          def check(condition):
           global checks
           assert condition;checks+=1
          
          def rejected(program,timeout=1):
           global checks
           started=time.monotonic()
           try:m.execute([sys.executable,'-c',program],timeout=timeout)
           except (m.FirewallError,UnicodeError):checks+=1
           else:raise AssertionError('unbounded command accepted')
           check(time.monotonic()-started<timeout+2)
          
          def running(pid):
           try:
            state=pathlib.Path('/proc',str(pid),'stat').read_text().rsplit(')',1)[1].split()[0]
           except FileNotFoundError:return False
           return state!='Z'
          
          before=len(os.listdir('/proc/self/fd'))
          check(m.execute([sys.executable,'-c','import sys; print("ordinary"); print("diagnostic",file=sys.stderr)'])=='ordinary')
          check(m.execute([sys.executable,'-c','import sys; print("stdin="+sys.stdin.read())'])=='stdin=')
          check(m.execute([sys.executable,'-c','import sys; print("missing"); sys.exit(3)'],missing=True)=='missing')
          rejected('import sys; sys.exit(3)')
          rejected('import os; [os.write(1,b"x"*4096) for _ in range(4096)]')
          rejected('import os; [os.write(2,b"x"*4096) for _ in range(4096)]')
          rejected('import os; [(os.write(1,b"x"*4096),os.write(2,b"x"*4096)) for _ in range(4096)]')
          rejected('import os,time; os.close(1); os.close(2); time.sleep(30)',timeout=.15)
          rejected('import os; os.write(1,bytes([255]))')
          with tempfile.TemporaryDirectory(prefix='vortex-bounded-proof-') as folder:
           for mode in ['timeout','leader-exit','oversize']:
            receipt=pathlib.Path(folder)/mode
            program='import subprocess,sys,time,os,pathlib;p=subprocess.Popen([sys.executable,"-c","import time; time.sleep(30)"]);pathlib.Path('+repr(str(receipt))+').write_text(str(p.pid));'
            if mode=='timeout':program+='time.sleep(30)'
            elif mode=='leader-exit':program+='sys.exit(0)'
            else:program+='[os.write(1,b"x"*4096) for _ in range(4096)]'
            rejected(program,timeout=1)
            pid=int(receipt.read_text())
            for _ in range(100):
             if not running(pid):break
             time.sleep(.01)
            check(not running(pid))
          check(len(os.listdir('/proc/self/fd'))==before)
          check('systemd' in m.execute(['/usr/bin/systemctl','--version']))
          if len(sys.argv)>2:
           result=m.execute(['/usr/sbin/ip','netns','exec',sys.argv[2],'/usr/sbin/iptables','-w','5','-t','filter','-S'])
           check('-P INPUT ' in result)
          print(json.dumps({'boundedRunnerChecks':checks,'hostFirewallMutations':False}))
          PY
          sudo python3 -I -B "$RUNNER_TEMP/vortex-firewall-bounded-proof.py" "$SOURCE_ROOT/server/firewall_native.py" "$SERVER_NS"
          cat > "$RUNNER_TEMP/vortex-firewall-persistent-fixture.py" <<'PY'
          import argparse, importlib.util, json, os, subprocess, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('vortex_native_firewall', Path(os.environ['SOURCE_ROOT']) / 'server/firewall_native.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          root = Path(os.environ['FIREWALL_ROOT'])
          def run(args, timeout=6, missing=False):
              if args[0] == '/usr/bin/systemctl':
                  assert args == ['/usr/bin/systemctl', 'show', 'netfilter-persistent.service', '--property=LoadState,ActiveState,SubState,UnitFileState,FragmentPath,ExecStart']
                  active = not (root / 'service-disabled').exists()
                  fragment = next(name for name in ('/usr/lib/systemd/system/netfilter-persistent.service', '/lib/systemd/system/netfilter-persistent.service') if (root / name.lstrip('/')).is_file())
                  return '\n'.join(['LoadState=loaded', 'ActiveState=' + ('active' if active else 'inactive'), 'SubState=' + ('exited' if active else 'dead'), 'UnitFileState=enabled', 'FragmentPath=' + fragment, 'ExecStart={ path=/usr/sbin/netfilter-persistent ; argv[]=/usr/sbin/netfilter-persistent start ; }'])
              return module.execute(args, timeout=timeout, missing=missing)
          controller = module.NativeFirewall(root=root, run=run)
          parser = argparse.ArgumentParser()
          parser.add_argument('command', choices=['inspect', 'sync', 'inspect-scope', 'cleanup-scope'])
          parser.add_argument('--owner')
          parser.add_argument('--expected-revision')
          parser.add_argument('--rules')
          parser.add_argument('--scope')
          parser.add_argument('--expected')
          args = parser.parse_args()
          if args.command == 'inspect': result = controller.inspect_owner(args.owner)
          elif args.command == 'sync': result = controller.sync_owner(args.owner, args.expected_revision, json.loads(args.rules))
          elif args.command == 'inspect-scope': result = controller.inspect_scope(args.scope)
          else: result = controller.cleanup_scope(args.scope, json.loads(args.expected))
          print(json.dumps(result, separators=(',', ':')))
          PY
          cat > "$RUNNER_TEMP/vortex-native-firewall.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import net from 'node:net';
          import dgram from 'node:dgram';
          import { createHash } from 'node:crypto';
          import { execFile } from 'node:child_process';
          import { promisify } from 'node:util';
          import { pathToFileURL } from 'node:url';
          const execute = promisify(execFile);
          const { createNativeFirewall } = await import(pathToFileURL(path.join(process.env.SOURCE_ROOT, 'server/native-firewall.js')));
          const root = process.env.FIREWALL_ROOT, fixture = process.env.PERSISTENCE_FIXTURE, source = process.env.SOURCE_ROOT;
          const scope = path.join(root, 'var/lib/vortex-firewall-ci');
          const scopeId = createHash('sha256').update(path.resolve(scope)).digest('hex').slice(0, 16);
          const ids = ['7ce0c88c-ff54-44ef-a8e7-8a7533ac88cd', 'fae8c8a0-0a33-48ec-94e4-d87cb9a8de37'];
          const bedrockPort = 28109, applicationPort = 28209;
          const server = { serverId: ids[0], transport: 'nethernet', ports: ['ipv4', 'ipv6'].flatMap(family => [{ family, protocol: 'tcp', port: String(bedrockPort) }, { family, protocol: 'udp', port: '28111:28112' }]) };
          const application = { serverId: ids[1], transport: 'tcp', ports: ['ipv4', 'ipv6'].map(family => ({ family, protocol: 'tcp', port: String(applicationPort) })) };
          const tools = { ipv4: '/usr/sbin/iptables', ipv6: '/usr/sbin/ip6tables' };
          const addresses = { ipv4: '10.248.0.1', ipv6: 'fd76:6f72:7465:7800::1' };
          const command = (file, args, options = {}) => {
            const { input, ...other } = options;
            const pending = execute(file, args, { timeout: 10000, maxBuffer: 4 * 1024 ** 2, ...other });
            pending.child.stdin.on('error', () => {}); pending.child.stdin.end(input);
            return pending;
          };
          const helper = async args => JSON.parse((await command('/usr/bin/python3', ['-I', '-B', fixture, ...args])).stdout);
          const exec = (file, args, options) => {
            if (file === '/usr/bin/python3' && args[0] === '-I' && path.resolve(args[1]) === path.join(source, 'server/firewall_native.py')) return command(file, ['-I', '-B', fixture, ...args.slice(2)], options);
            return command(file, args, options);
          };
          assert.equal(process.platform, 'linux'); assert.equal(process.getuid(), 0);
          // The namespace proves the production native backend. UFW selection is
          // covered separately; no host UFW availability or configuration is faked.
          const native = createNativeFirewall({ exec, supported: true, present: key => ({ message: key, messageI18n: { en: key, vi: key } }), assertNativeAllowed: async () => {} });
          const controller = {
            inspect: network => native.inspect(network, 'vortex:' + scopeId + ':' + network.serverId),
            apply: (network, input) => native.apply(network, { ...input, scopeId }, async () => network),
            remove: (network, input) => native.apply(network, { ...input, scopeId }, async () => network, true)
          };
          const files = ['rules.v4', 'rules.v6'].map(name => path.join(root, 'etc/iptables', name));
          const originals = await Promise.all(files.map(filename => fs.readFile(filename)));
          const originalModes = await Promise.all(files.map(async filename => { const s = await fs.stat(filename); return [s.uid, s.gid, s.mode & 0o777]; }));
          const baseline = await Promise.all(Object.values(tools).map(async file => (await command(file, ['-w', '5', '-t', 'filter', '-S'])).stdout));
          const ownedTokens = (owner, protocol, port) => ['INPUT', '-p', protocol, '-m', protocol, '--dport', port, '-m', 'comment', '--comment', owner, '-j', 'ACCEPT'];
          const servers = [], sockets = [];
          const clientCode = `import net from 'node:net'; import dgram from 'node:dgram'; const [protocol,host,port,localPort]=process.argv.slice(1); let finished=false; const socket=protocol==='tcp'?net.connect({host,port:Number(port),localPort:Number(localPort)}):dgram.createSocket(host.includes(':')?'udp6':'udp4'); const timer=setTimeout(()=>finish(false),700); function finish(reachable){if(finished)return;finished=true;clearTimeout(timer);if(protocol==='tcp')socket.destroy();else socket.close();console.log(JSON.stringify({reachable}));} socket.on('error',()=>finish(false));if(protocol==='tcp')socket.once('connect',()=>finish(true));else{socket.once('message',data=>finish(data.toString()==='vortex-firewall-proof'));socket.bind(Number(localPort),host.includes(':')?'::':'0.0.0.0',()=>socket.send(Buffer.from('vortex-firewall-proof'),Number(port),host));}`;
          let probeSequence = 0;
          async function reachable(family, protocol, port) {
            const result = await command('/usr/sbin/ip', ['netns', 'exec', process.env.CLIENT_NS, process.execPath, '--input-type=module', '-e', clientCode, protocol, addresses[family], String(port), String(40000 + ++probeSequence)], { timeout: 2500 });
            return JSON.parse(result.stdout).reachable;
          }
          async function connectivity(expected) {
            for (const family of Object.keys(tools)) {
              assert.equal(await reachable(family, 'tcp', bedrockPort), expected, family + ' TCP');
              assert.equal(await reachable(family, 'udp', 28111), expected, family + ' UDP');
            }
          }
          async function unchangedForeign() {
            for (const [index, tool] of Object.values(tools).entries()) {
              const lines = (await command(tool, ['-w', '5', '-t', 'filter', '-S'])).stdout.split('\n').filter(line => !line.includes('vortex:' + scopeId + ':')).join('\n');
              assert.equal(lines, baseline[index]);
            }
            for (const [index, filename] of files.entries()) {
              const s = await fs.stat(filename); assert.deepEqual([s.uid, s.gid, s.mode & 0o777], originalModes[index]);
              const content = await fs.readFile(filename, 'utf8');
              assert.equal(content.split(/(?<=\n)/).filter(line => !line.includes('vortex:' + scopeId + ':')).join(''), originals[index].toString());
            }
          }
          try {
            for (const port of [bedrockPort, applicationPort]) {
              const listener = net.createServer(socket => socket.end());
              await new Promise((resolve, reject) => { listener.once('error', reject); listener.listen({ host: '::', port }, resolve); }); servers.push(listener);
            }
            for (const family of Object.keys(tools)) {
              const socket = dgram.createSocket({ type: family === 'ipv4' ? 'udp4' : 'udp6', ipv6Only: family === 'ipv6' });
              socket.on('message', (message, peer) => socket.send(message, peer.port, peer.address));
              await new Promise((resolve, reject) => { socket.once('error', reject); socket.bind(28111, family === 'ipv4' ? '0.0.0.0' : '::', resolve); }); sockets.push(socket);
            }
            await connectivity(false);
            const first = await controller.inspect(server);
            assert.equal(first.backend, 'iptables'); assert.equal(first.canApply, true); assert.equal(first.persistence.ready, true);
            assert.ok(first.ports.every(row => row.state === 'missing'));
            const applied = await controller.apply(server, { revision: first.revision, confirmed: true });
            assert.equal(applied.ok, true); assert.ok(applied.ports.every(row => row.live && row.saved));
            await connectivity(true); await unchangedForeign();
            const again = await controller.apply(server, { revision: (await controller.inspect(server)).revision, confirmed: true });
            assert.equal(again.ok, true); assert.equal(again.added.length, 0); assert.equal(again.removed.length, 0);
            const owner = 'vortex:' + scopeId + ':' + server.serverId;
            await command(tools.ipv4, ['-w', '5', '-t', 'filter', '-A', ...ownedTokens(owner, 'tcp', String(bedrockPort))]);
            const duplicate = await controller.apply(server, { revision: (await controller.inspect(server)).revision, confirmed: true });
            assert.equal(duplicate.ok, true);
            const live4 = (await command(tools.ipv4, ['-w', '5', '-t', 'filter', '-S', 'INPUT'])).stdout.split('\n');
            assert.equal(live4.filter(line => line.includes(owner) && line.includes('--dport ' + bedrockPort + ' ')).length, 1, 'A safe plus misplaced identical tuple must normalize to exactly one rule.');
            await unchangedForeign();
            const stale = await controller.inspect(server);
            await command(tools.ipv4, ['-w', '5', '-t', 'filter', '-A', 'INPUT', '-p', 'tcp', '--dport', '28999', '-m', 'comment', '--comment', 'concurrent-provider-change', '-j', 'DROP']);
            await assert.rejects(controller.apply(server, { revision: stale.revision, confirmed: true }), error => error.code === 'FIREWALL_STALE');
            await command(tools.ipv4, ['-w', '5', '-t', 'filter', '-D', 'INPUT', '-p', 'tcp', '--dport', '28999', '-m', 'comment', '--comment', 'concurrent-provider-change', '-j', 'DROP']);
            const persistence = await helper(['inspect', '--owner', owner]);
            const oldFile = await fs.readFile(files[1]);
