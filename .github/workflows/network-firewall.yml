            await command(tools.ipv4, ['-w', '5', '-t', 'filter', '-D', 'ufw-user-input', '-p', 'tcp', '-m', 'tcp', '--dport', String(applicationPort), '-m', 'comment', '--comment', appOwner, '-j', 'DROP']);
