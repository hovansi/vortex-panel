name: Native ARM64

on:
  workflow_call:
    inputs:
      runtime_artifact:
        description: Validated Bedrock engine artifact from this workflow run
        type: string
        required: false
        default: ''
      python_managed:
        description: Build and exercise the latest pinned Python from official source
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      python_managed:
        description: Build and exercise the latest pinned Python from official source
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  engine:
    if: ${{ !inputs.runtime_artifact }}
    uses: ./.github/workflows/bedrock-engine.yml

  installed-applications:
    needs: engine
    if: ${{ !cancelled() && (needs.engine.result == 'success' || needs.engine.result == 'skipped') }}
    name: Ubuntu ARM64 / native installed applications
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the validated ARM64 engine bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.runtime_artifact || needs.engine.outputs.artifact_name }}
          path: deploy
      - name: Verify native ARM64 kernel and userspace
        run: |
          test "$(uname -m)" = aarch64
          test "$(dpkg --print-architecture)" = arm64
          test -d /run/systemd/system
      - name: Prepare trusted runtime ancestry on the disposable runner
        shell: bash
        run: |
          set -Eeuo pipefail
          # Hosted runner tooling exposes shared directories. This disposable VM
          # uses the root-owned 0755 ancestry required on a production Ubuntu host.
          for directory in /opt /mnt; do
            test -d "$directory"
            test ! -L "$directory"
            test "$(stat -c '%u' -- "$directory")" = 0
            printf 'Disposable runner %s: %s -> 0:755\n' "$directory" "$(stat -c '%u:%a' -- "$directory")"
            sudo chmod 0755 -- "$directory"
            test "$(stat -c '%u:%a' -- "$directory")" = 0:755
          done
      - name: Install the panel with its production installer
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          if ! sudo env PATH=/usr/sbin:/usr/bin:/sbin:/bin bash deploy/install.sh \
            --root-mode --local-only --self-signed --no-network-tuning \
            > "$RUNNER_TEMP/vortex-native-install.log" 2>&1; then
            echo 'Native ARM64 installer failed; no application lifecycle was counted as passed.' >&2
            sed -E 's/(One-time setup token:|SETUP TOKEN:).*/\1 [redacted]/' "$RUNNER_TEMP/vortex-native-install.log" | tail -n 100 >&2
            exit 1
          fi
          sudo systemctl is-active --quiet vortex-panel.service
      - name: Verify CLI upgrade preserves foreign historical release ownership
        timeout-minutes: 15
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ $GITHUB_RUN_ID =~ ^[0-9]+$ && $GITHUB_RUN_ATTEMPT =~ ^[0-9]+$ ]]
          FIXTURE_STATE=/run/vortex-native-ledger-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
          sudo test ! -e "$FIXTURE_STATE"
          sudo test ! -L "$FIXTURE_STATE"
          sudo install -d -o root -g root -m 0700 "$FIXTURE_STATE"
          sudo /usr/bin/python3 -I -B - "$FIXTURE_STATE" <<'PY'
          import hashlib, json, os, stat, subprocess, sys, uuid
          from pathlib import Path
          state = Path(sys.argv[1])
          source, releases = Path('/opt/vortex-panel'), Path('/opt/vortex-panel/releases')
          for directory in [source, releases, state]:
              info = directory.lstat()
              assert stat.S_ISDIR(info.st_mode) and info.st_uid == 0 and not info.st_mode & 0o022
          manifest = json.loads(Path('/etc/vortex-panel/install-manifest.json').read_text())
          assert manifest['freshInstall'] is True and manifest['baselineUnknown'] is False
          assert str(source) in manifest['before']['paths'] and manifest['before']['paths'][str(source)] is None
          current = (source / 'current').resolve(strict=True)
          assert current.parent == releases
          fixture = releases / ('ci-foreign-history-' + uuid.uuid4().hex)
          fixture.mkdir(mode=0o755)
          fixture.chmod(0o755)
          dependency = fixture / 'node_modules'
          dependency.mkdir(mode=0o755)
          dependency.chmod(0o755)
          filename = dependency / 'upstream-private.txt'
          payload = ('Owned native ledger regression ' + uuid.uuid4().hex + '\n').encode()
          descriptor = os.open(filename, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(descriptor, 'wb') as stream:
              stream.write(payload)
              stream.flush()
              os.fsync(stream.fileno())
              os.fchown(stream.fileno(), 501, 20)
              os.fchmod(stream.fileno(), 0o600)
          rows = []
          for path in [fixture, dependency, filename]:
              info = path.lstat()
              rows.append({'path': str(path), 'dev': info.st_dev, 'ino': info.st_ino, 'uid': info.st_uid,
                           'gid': info.st_gid, 'mode': stat.S_IMODE(info.st_mode), 'nlink': info.st_nlink})
          immutable = {key: manifest[key] for key in ['before', 'installId', 'freshInstall', 'baselineUnknown', 'createdAt']}
          proof = {'fixture': str(fixture), 'rows': rows, 'sha256': hashlib.sha256(payload).hexdigest(),
                   'immutable': immutable, 'current': str(current),
                   'pid': subprocess.check_output(['systemctl', 'show', 'vortex-panel.service', '--property=MainPID', '--value'], text=True).strip()}
          assert proof['pid'].isdigit() and int(proof['pid']) > 1
          with (state / 'proof.json').open('x') as stream:
              json.dump(proof, stream)
          print('Seeded only an owned historical release fixture with a UID 501, GID 20, mode 0600 dependency.')
          PY
          cleanup_fixture() {
            local code=$?
            trap - EXIT
            if ! sudo /usr/bin/python3 -I -B - "$FIXTURE_STATE" <<'PY'
          import hashlib, json, os, re, stat, sys
          from pathlib import Path
          state = Path(sys.argv[1])
          assert re.fullmatch(r'/run/vortex-native-ledger-[0-9]+-[0-9]+', str(state))
          proof = json.loads((state / 'proof.json').read_text())
          root = Path('/opt/vortex-panel/releases')
          fixture = Path(proof['fixture'])
          assert fixture.parent == root and re.fullmatch(r'ci-foreign-history-[a-f0-9]{32}', fixture.name)
          assert root.resolve(strict=True) == root and fixture.resolve(strict=True) == fixture
          assert Path('/opt/vortex-panel/current').resolve(strict=True) != fixture
          expected = [fixture, fixture / 'node_modules', fixture / 'node_modules/upstream-private.txt']
          assert [row['path'] for row in proof['rows']] == [str(path) for path in expected]
          assert sorted(path.name for path in fixture.iterdir()) == ['node_modules']
          assert sorted(path.name for path in expected[1].iterdir()) == ['upstream-private.txt']
          for path, row in zip(expected, proof['rows']):
              info = path.lstat()
              assert not stat.S_ISLNK(info.st_mode)
              assert (info.st_dev, info.st_ino, info.st_uid, info.st_gid, stat.S_IMODE(info.st_mode), info.st_nlink) == tuple(row[key] for key in ['dev', 'ino', 'uid', 'gid', 'mode', 'nlink'])
          assert hashlib.sha256(expected[2].read_bytes()).hexdigest() == proof['sha256']
          expected[2].unlink()
          expected[1].rmdir()
          fixture.rmdir()
          (state / 'proof.json').unlink()
          state.rmdir()
          PY
            then
              echo 'Owned historical fixture changed; preserved it for disposable-VM diagnostics.' >&2
              code=1
            fi
            exit "$code"
          }
          trap cleanup_fixture EXIT
          if ! sudo env PATH=/usr/sbin:/usr/bin:/sbin:/bin bash deploy/install.sh \
            --root-mode --self-signed --no-network-tuning \
            > "$RUNNER_TEMP/vortex-native-ledger-upgrade.log" 2>&1; then
            echo 'Native CLI upgrade failed with a foreign-owned historical dependency.' >&2
            sed -E 's/(One-time setup token:|SETUP TOKEN:).*/\1 [redacted]/' "$RUNNER_TEMP/vortex-native-ledger-upgrade.log" | tail -n 100 >&2
            exit 1
          fi
          sudo systemctl is-active --quiet vortex-panel.service
          sudo /usr/bin/python3 -I -B - "$FIXTURE_STATE" <<'PY'
          import hashlib, http.client, json, stat, subprocess, sys
          from pathlib import Path
          proof = json.loads((Path(sys.argv[1]) / 'proof.json').read_text())
          manifest = json.loads(Path('/etc/vortex-panel/install-manifest.json').read_text())
          assert {key: manifest[key] for key in proof['immutable']} == proof['immutable']
          current = Path('/opt/vortex-panel/current').resolve(strict=True)
          assert current.parent == Path('/opt/vortex-panel/releases') and str(current) != proof['current']
          components = manifest['components']
          assert any(row['path'] == str(current) and row['origin'] == 'installer-created-release' for row in components)
          assert any(row['path'] == '/opt/vortex-panel/current' and row['origin'] == 'installer-release-link' for row in components)
          assert not any(row['path'] == proof['fixture'] or row['path'].startswith(proof['fixture'] + '/') for row in components)
          for row in proof['rows']:
              info = Path(row['path']).lstat()
              assert not stat.S_ISLNK(info.st_mode)
              assert (info.st_dev, info.st_ino, info.st_uid, info.st_gid, stat.S_IMODE(info.st_mode), info.st_nlink) == tuple(row[key] for key in ['dev', 'ino', 'uid', 'gid', 'mode', 'nlink'])
          assert hashlib.sha256(Path(proof['rows'][-1]['path']).read_bytes()).hexdigest() == proof['sha256']
          pid = subprocess.check_output(['systemctl', 'show', 'vortex-panel.service', '--property=MainPID', '--value'], text=True).strip()
          assert pid.isdigit() and int(pid) > 1 and pid != proof['pid']
          connection = http.client.HTTPConnection('127.0.0.1', 3000, timeout=5)
          try:
              connection.request('GET', '/healthz')
              response = connection.getresponse()
              health = json.loads(response.read(65537))
              assert response.status == 200 and health['ok'] is True and health['service'] == 'vortex-panel' and health['processId'] == int(pid)
          finally:
              connection.close()
          assert subprocess.check_output(['systemctl', 'show', 'vortex-panel.service', '--property=MainPID', '--value'], text=True).strip() == pid
          print(json.dumps({'nativeArchitecture': 'arm64', 'cliUpgradeWithForeignHistoricalDependency': True,
                            'originalAbsentSourceBaselinePreserved': True, 'installationIdentityPreserved': True,
                            'foreignHistoryUnmodifiedAndNotAdopted': True, 'newReleaseHealthy': True, 'passed': True}))
          PY
      - name: Exercise authenticated native application lifecycles
        shell: bash
        env:
          PYTHON_MANAGED: ${{ inputs.python_managed && '1' || '0' }}
        run: |
          set -Eeuo pipefail
          PANEL_PID=$(sudo systemctl show vortex-panel.service --property=MainPID --value)
          [[ $PANEL_PID =~ ^[1-9][0-9]*$ ]]
          PANEL_NODE=$(sudo readlink -f "/proc/$PANEL_PID/exe")
          sudo "$PANEL_NODE" --input-type=module - "$PYTHON_MANAGED" <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { randomBytes } from 'node:crypto';
          import { openSync, readSync, closeSync, lstatSync, realpathSync, readFileSync } from 'node:fs';
          import { dirname, basename } from 'node:path';
          import { setTimeout as delay } from 'node:timers/promises';
          assert.equal(process.platform, 'linux');
          assert.equal(process.arch, 'arm64');
          assert.ok(['0', '1'].includes(process.argv[2]));
          assert.equal(execFileSync('uname', ['-m'], { encoding: 'utf8' }).trim(), 'aarch64');
          const pythonManaged = process.argv[2] === '1';
          function trustMetadata(filename, scope) {
            try { const value = lstatSync(filename); return { scope, uid: value.uid, gid: value.gid, mode: value.mode & 0o7777, nlink: value.nlink, type: value.isDirectory() ? 'directory' : value.isFile() ? 'file' : value.isSymbolicLink() ? 'symlink' : 'other', canonical: realpathSync(filename) === filename }; }
            catch (error) { return { scope, available: false, code: ['ENOENT', 'EACCES', 'ENOTDIR'].includes(error.code) ? error.code : 'INSPECTION_FAILED' }; }
          }
          const nodePrefix = dirname(dirname(process.execPath)), ancestry = [];
          for (let cursor = process.execPath; ancestry.length < 16; cursor = dirname(cursor)) { ancestry.unshift(cursor); if (cursor === dirname(cursor)) break; }
          console.log(JSON.stringify({ stage: 'native-node-trust', executable: process.execPath, prefixLayout: basename(process.execPath) === 'node' && basename(dirname(process.execPath)) === 'bin' && (['/usr', '/usr/local'].includes(nodePrefix) || /^node-v?\d+\.\d+\.\d+-linux-(?:x64|arm64)$/.test(basename(nodePrefix))), version: execFileSync(process.execPath, ['--version'], { encoding: 'utf8' }).trim(), ancestors: ancestry.map((filename, index) => trustMetadata(filename, 'node-ancestor-' + index)), npm: trustMetadata(nodePrefix + '/lib/node_modules/npm/bin/npm-cli.js', 'npm-cli') }));
          const hostPython = JSON.parse(execFileSync('/usr/bin/python3', ['-I', '-c', 'import json,platform,ssl,sqlite3,venv; print(json.dumps({"arch":platform.machine(),"version":platform.python_version(),"ssl":ssl.OPENSSL_VERSION}))'], { encoding: 'utf8' }));
          assert.equal(hostPython.arch, 'aarch64');
          console.log(JSON.stringify({ stage: 'native-host', node: process.version, nodeArch: process.arch, hostPython, managedPythonRequested: pythonManaged }));
          const unit = 'vortex-panel.service';
          const panelPid = execFileSync('systemctl', ['show', unit, '--property=MainPID', '--value'], { encoding: 'utf8' }).trim();
          const invocation = execFileSync('systemctl', ['show', unit, '--property=InvocationID', '--value'], { encoding: 'utf8' }).trim();
          assert.match(panelPid, /^[1-9][0-9]*$/);
          assert.match(invocation, /^[a-f0-9]{32}$/);
          const journal = execFileSync('journalctl', ['-b', '-u', unit, '_PID=' + panelPid, '_SYSTEMD_INVOCATION_ID=' + invocation, '-n', '100', '--no-pager', '-o', 'cat'], { encoding: 'utf8' });
          const setupToken = [...journal.matchAll(/^SETUP TOKEN: ([A-Za-z0-9_-]{20,128})$/gm)].at(-1)?.[1];
          assert.ok(setupToken, 'The current managed service must provide a one-time setup token.');
          const origin = 'http://127.0.0.1:3000';
          let cookie = '', csrf = '';
          async function request(path, method = 'GET', body) {
            const headers = { Origin: origin, 'Accept-Language': 'en' };
            if (cookie) headers.Cookie = cookie;
            if (csrf) headers['X-CSRF-Token'] = csrf;
            if (body !== undefined) headers['Content-Type'] = 'application/json';
            const response = await fetch(origin + '/api' + path, { method, headers, ...(body === undefined ? {} : { body: JSON.stringify(body) }), signal: AbortSignal.timeout(120000) });
            const value = await response.json();
            assert.ok(response.ok, `${method} ${path} failed with ${response.status}: ${value.code || value.error || 'unknown error'}`);
            for (const row of response.headers.getSetCookie()) if (row.startsWith('bedrock.sid=')) cookie = row.split(';')[0];
            if (value.csrfToken) csrf = value.csrfToken;
            return value;
          }
          const pending = await request('/auth/status');
          assert.equal(pending.setupRequired, true);
          await request('/auth/setup', 'POST', { token: setupToken, username: 'arm-native', password: randomBytes(32).toString('base64url') });
          assert.ok(cookie && csrf);
          const dashboard = await request('/dashboard');
          const capabilities = dashboard.capabilities;
          console.log(JSON.stringify({ stage: 'native-capabilities', application: { supported: capabilities.applicationRuntime.supported, reason: capabilities.applicationRuntime.reason, reasonCode: capabilities.applicationRuntime.reasonCode, diagnosticPhase: capabilities.applicationRuntime.diagnosticPhase, runtimes: capabilities.applicationRuntime.runtimes.map(runtime => ({ kind: runtime.kind, available: runtime.available, managedAvailable: runtime.managedAvailable, missing: runtime.prerequisites?.missing || [] })) }, resources: { supported: capabilities.resourceControl.supported, fixedSupported: capabilities.resourceControl.fixedSupported, pidsSupported: capabilities.resourceControl.pidsSupported, reason: capabilities.resourceControl.reason, configuredUnit: capabilities.resourceControl.configuredUnit }, storage: { supported: capabilities.storageControl.supported, fixedSupported: capabilities.storageControl.fixedSupported, reason: capabilities.storageControl.reason } }));
          assert.equal(dashboard.host.arch, 'arm64');
          assert.equal(dashboard.capabilities.bedrockRuntime.supported, true);
          assert.equal(dashboard.capabilities.bedrockRuntime.mode, 'box64');
          assert.equal(dashboard.capabilities.applicationRuntime.supported, true);
          assert.equal(dashboard.capabilities.resourceControl.fixedSupported, true);
          assert.equal(dashboard.capabilities.resourceControl.pidsSupported, true);
          assert.equal(dashboard.capabilities.storageControl.fixedSupported, true);
          assert.equal(dashboard.servers.length, 0);
          const owned = new Set();
          const report = [];
          async function server(id) { return (await request('/servers/' + encodeURIComponent(id))).server; }
          async function waitState(id, wanted) {
            const deadline = Date.now() + 120000;
            while (Date.now() < deadline) {
              const value = await server(id);
              if (value.status === wanted) return value;
              assert.ok(!['error', 'crashed'].includes(value.status), `Application entered ${value.status}: ${value.error || 'no reason supplied'}`);
              await delay(1000);
            }
            throw new Error('Native application never reached ' + wanted);
          }
          async function waitJob(id, kind) {
            const deadline = Date.now() + (kind === 'python' ? 50 * 60 : 10 * 60) * 1000;
            let logged = 0;
            while (Date.now() < deadline) {
              const { job } = await request('/jobs/' + encodeURIComponent(id));
              if (Date.now() - logged > 15000) { console.log(JSON.stringify({ stage: 'install', kind, status: job.status, phase: job.phase, progress: job.progress })); logged = Date.now(); }
              if (job.status === 'completed') return;
              if (!['queued', 'pending', 'running'].includes(job.status)) {
                if (owned.has(job.serverId)) {
                  const { logs } = await request('/servers/' + encodeURIComponent(job.serverId) + '/logs');
                  console.error(JSON.stringify({ stage: 'owned-application-install-failed', kind, output: logs.slice(-40).map(row => row.message) }));
                }
                throw new Error(`Native ${kind} installation ended with ${job.status}: ${job.error || job.message || 'no reason supplied'}`);
              }
              await delay(1000);
            }
            throw new Error('Native managed ' + kind + ' installation did not complete.');
          }
          function elf64(filename) {
            const file = openSync(filename, 'r'); const header = Buffer.alloc(64);
            try { assert.equal(readSync(file, header, 0, header.length, 0), 64); } finally { closeSync(file); }
            assert.equal(header.subarray(0, 4).toString('hex'), '7f454c46');
            assert.equal(header[4], 2); assert.equal(header[5], 1); assert.equal(header.readUInt16LE(18), 183);
          }
          async function roundTrip(value, kind) {
            assert.equal(value.status, 'running');
            assert.ok(value.pid > 1 && value.applicationRuntime.uid > 0);
            assert.equal(value.resources.effective.kernelEnforced, true);
            const response = await fetch('http://127.0.0.1:' + value.port, { signal: AbortSignal.timeout(10000) });
            assert.equal(response.status, 200);
            assert.equal(await response.text(), kind === 'nodejs' ? 'Vortex Node.js application is running.\n' : 'Vortex Python application is running.\n');
          }
          async function exercise(kind) {
            const created = await request('/servers', 'POST', { kind, name: 'ARM64 native ' + kind, portAllocation: 'auto', storagePolicy: { mode: 'fixed', diskGiB: 1 }, resourcePolicy: { mode: 'shared' }, application: { dependencies: 'none', readiness: 'tcp' } });
            const id = created.server.id; owned.add(id);
            assert.equal(created.server.runtime.arch, 'arm64');
            assert.equal(created.server.runtime.mode, 'managed');
            assert.ok(created.server.port >= 1024 && created.server.port <= 65535);
            const pin = JSON.stringify(created.server.runtime);
            await waitJob(created.job.id, kind);
            const installed = await waitState(id, 'stopped');
            assert.equal(JSON.stringify(installed.runtime), pin);
            const prefix = '/var/lib/vortex-panel/.application-runtimes/' + kind + '-' + installed.runtime.version + '-linux-arm64/prefix';
            const executable = prefix + (kind === 'nodejs' ? '/bin/node' : '/bin/python' + installed.runtime.version.split('.').slice(0, 2).join('.'));
            elf64(executable);
            const artifact = JSON.parse(readFileSync(dirname(prefix) + '/.runtime.json', 'utf8'));
            assert.equal(artifact.pin.version, installed.runtime.version);
            assert.equal(artifact.pin.arch, 'arm64');
            assert.match(artifact.pin.sha256, /^[a-f0-9]{64}$/);
            await request('/servers/' + id + '/start', 'POST', {});
            const first = await waitState(id, 'running'); await roundTrip(first, kind);
            await request('/servers/' + id + '/restart', 'POST', {});
            const restarted = await waitState(id, 'running'); await roundTrip(restarted, kind);
            assert.notEqual(restarted.pid, first.pid);
            assert.equal(JSON.stringify(restarted.runtime), pin);
            await request('/servers/' + id + '/stop', 'POST', {}); await waitState(id, 'stopped');
            await request('/servers/' + id, 'DELETE'); owned.delete(id);
            assert.equal((await request('/servers')).servers.some(row => row.id === id), false);
            report.push({ kind, version: installed.runtime.version, arch: installed.runtime.arch, nativeELF: true, sourceSHA256: artifact.pin.sha256, runtimePinPreserved: true, httpLifecyclePassed: true, removed: true });
            console.log(JSON.stringify({ stage: 'application-complete', ...report.at(-1) }));
          }
          try {
            await exercise('nodejs');
            if (pythonManaged) await exercise('python');
            assert.equal(execFileSync('systemctl', ['show', unit, '--property=MainPID', '--value'], { encoding: 'utf8' }).trim(), panelPid);
            assert.equal((await request('/servers')).servers.length, 0);
            console.log(JSON.stringify({ nativeArchitecture: 'arm64', actualInstalledPanel: true, managedApplications: report, managedPythonBuilt: pythonManaged, passed: true }));
          } finally {
            for (const id of owned) {
              try { const value = await server(id); if (value.status === 'running') { await request('/servers/' + id + '/stop', 'POST', {}); await waitState(id, 'stopped'); } if ((await server(id)).status === 'stopped') await request('/servers/' + id, 'DELETE'); }
              catch { console.error('Cleanup of an owned ephemeral application requires VM disposal.'); }
            }
            if (cookie) await request('/auth/logout', 'POST', {}).catch(() => {});
          }
          NODE
      - name: Verify the installed native worker
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          PANEL_PID=$(sudo systemctl show vortex-panel.service --property=MainPID --value)
          if ! sudo env PATH=/usr/sbin:/usr/bin:/sbin:/bin bash deploy/install-node.sh \
            --endpoint https://127.0.0.1:8443 \
            > "$RUNNER_TEMP/vortex-native-worker-install.log" 2>&1; then
            echo 'Native ARM64 worker installer failed; private connection details remain in the disposable VM.' >&2
            sudo systemctl show vortex-node.service --property=ActiveState --property=SubState --property=Result >&2
            exit 1
          fi
          sudo systemctl is-active --quiet vortex-node.service
          WORKER_PID=$(sudo systemctl show vortex-node.service --property=MainPID --value)
          [[ $WORKER_PID =~ ^[1-9][0-9]*$ ]]
          WORKER_NODE=$(sudo readlink -f "/proc/$WORKER_PID/exe")
          sudo "$WORKER_NODE" --input-type=module - "$PANEL_PID" "$WORKER_PID" <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readNodeConfig, nodeConnection } from '/opt/vortex-node/current/server/node-cli.js';
          import { requestNode } from '/opt/vortex-node/current/server/node-transport.js';
          assert.equal(process.platform, 'linux');
          assert.equal(process.arch, 'arm64');
          const config = readNodeConfig('/etc/vortex-node.json');
          const connection = nodeConnection(config, 'https://127.0.0.1:' + config.port);
          assert.match(connection.fingerprint, /^[A-F0-9]{64}$/);
          const identity = await requestNode(connection);
          assert.equal(identity.service, 'vortex-node');
          assert.equal(identity.protocol, 1);
          assert.equal(identity.nodeId, config.nodeId);
          assert.equal(identity.processId, Number(process.argv[3]));
          await assert.rejects(requestNode({ ...connection, token: 'A'.repeat(43) }), error => error.status === 401);
          const snapshot = await requestNode(connection, { path: '/api/node/snapshot' });
          assert.equal(snapshot.host.arch, 'arm64');
          assert.equal(snapshot.capabilities.bedrockRuntime.supported, true);
          assert.equal(snapshot.capabilities.bedrockRuntime.mode, 'box64');
          assert.equal(snapshot.capabilities.applicationRuntime.supported, true);
