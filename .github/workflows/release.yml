name: Release

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact stable release tag matching package.json'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag / Node 22 / ${{ matrix.os }}
    if: ${{ github.event_name != 'push' || github.ref_type == 'tag' || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Require an exact stable version tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const automatic = process.env.GITHUB_EVENT_NAME === 'push' && process.env.GITHUB_REF_TYPE === 'branch'
            && process.env.GITHUB_REF === 'refs/heads/main';
          const tag = automatic ? `v${pkg.version}` : process.env.RELEASE_TAG;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(pkg.version)
              || !/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag)
              || tag !== `v${pkg.version}` || lock.version !== pkg.version
              || lock.packages?.['']?.version !== pkg.version) throw new Error('Tag and package versions must match exactly.');
          if (!/^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?\/[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$/.test(process.env.GITHUB_REPOSITORY)
              || process.env.GITHUB_SERVER_URL !== 'https://github.com' || event.repository?.private !== false
              || event.repository?.full_name !== process.env.GITHUB_REPOSITORY) throw new Error('Exact public GitHub release scope required.');
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (head !== process.env.GITHUB_SHA) throw new Error('The checkout must resolve to the validated commit.');
          if (automatic) {
            if (event.ref !== 'refs/heads/main' || event.head_commit?.id !== process.env.GITHUB_SHA
                || typeof event.head_commit?.message !== 'string'
                || event.head_commit.message.split(/\r?\n/, 1)[0] !== `Release v${pkg.version}`) throw new Error('Automatic publication requires the exact release commit on main.');
          } else if (process.env.GITHUB_EVENT_NAME === 'push' && process.env.GITHUB_REF_TYPE === 'tag'
              && process.env.GITHUB_REF === `refs/tags/${tag}` && event.ref === process.env.GITHUB_REF) {
            const tagged = execFileSync('git', ['rev-parse', '--verify', `refs/tags/${tag}^{commit}`], { encoding: 'utf8' }).trim();
            if (head !== tagged) throw new Error('The tag must resolve to the validated commit.');
          } else if (process.env.GITHUB_EVENT_NAME !== 'workflow_dispatch' || process.env.GITHUB_REF_TYPE !== 'branch'
              || !process.env.GITHUB_REF?.startsWith('refs/heads/')) {
            throw new Error('Use an exact release commit on main, a tag push or a maintainer branch dispatch.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          NODE
      - name: Confirm native runner architecture
        env:
          EXPECTED_ARCH: ${{ endsWith(matrix.os, '-arm') && 'arm64' || 'x64' }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const arm = process.env.EXPECTED_ARCH === 'arm64';
          const kernel = execFileSync('uname', ['-m'], { encoding: 'utf8' }).trim();
          const userspace = execFileSync('dpkg', ['--print-architecture'], { encoding: 'utf8' }).trim();
          if (process.platform !== 'linux' || process.arch !== process.env.EXPECTED_ARCH
              || kernel !== (arm ? 'aarch64' : 'x86_64') || userspace !== (arm ? 'arm64' : 'amd64')) {
            throw new Error('The Node interpreter, kernel and Ubuntu userspace must run natively on the expected architecture.');
          }
          console.log(JSON.stringify({ platform: process.platform, node: process.arch, kernel, userspace }));
          NODE
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate production source
        run: npm run check
      - name: Check bootstrap syntax
        run: bash -n deploy/bootstrap.sh

  bedrock-engine:
    name: Build pinned Bedrock ARM64 engine
    needs: verify
    uses: ./.github/workflows/bedrock-engine.yml

  native-arm:
    name: Native ARM64 installation and applications
    needs: [verify, bedrock-engine]
    uses: ./.github/workflows/native-arm.yml
    with:
      python_managed: false
      runtime_artifact: ${{ needs.bedrock-engine.outputs.artifact_name }}

  bedrock-arm:
    name: Minecraft Bedrock on ARM64
    needs: [verify, bedrock-engine]
    uses: ./.github/workflows/bedrock-arm.yml
    with:
      runtime_artifact: ${{ needs.bedrock-engine.outputs.artifact_name }}

  network-firewall:
    name: Isolated native firewall and persistence
    needs: verify
    uses: ./.github/workflows/network-firewall.yml

  network-nat:
    name: NetherNet NAT and network lifecycle
    needs: verify
    uses: ./.github/workflows/network-nat.yml

  https:
    name: Public HTTPS port and upgrade compatibility
    needs: verify
    uses: ./.github/workflows/https.yml

  publish:
    name: Build and publish verified assets
    needs: [verify, bedrock-engine, native-arm, bedrock-arm, network-firewall, network-nat, https]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.verify.outputs.tag }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - name: Check out validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Download the validated ARM64 engine bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.bedrock-engine.outputs.artifact_name }}
          path: deploy
      - name: Build public release assets
        run: |
          node scripts/release.js --require-bedrock-runtime --repository "$GITHUB_REPOSITORY" --output "output/release/$RELEASE_TAG"
          cd "output/release/$RELEASE_TAG"
          sha256sum --check --strict SHA256SUMS
          bash -n install.sh
      - name: Create draft, verify uploaded assets, then publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_HOST: github.com
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync, lstatSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { createHash } from 'node:crypto';
          import { spawnSync, execFileSync } from 'node:child_process';
          const need = (value, message) => { if (!value) throw new Error(message); };
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const tag = process.env.RELEASE_TAG;
          const repo = process.env.GH_REPO;
          const manual = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch' && process.env.GITHUB_REF_TYPE === 'branch'
            && process.env.GITHUB_REF?.startsWith('refs/heads/');
          const automatic = process.env.GITHUB_EVENT_NAME === 'push' && process.env.GITHUB_REF_TYPE === 'branch'
            && process.env.GITHUB_REF === 'refs/heads/main';
          const tagged = process.env.GITHUB_EVENT_NAME === 'push' && process.env.GITHUB_REF_TYPE === 'tag'
            && process.env.GITHUB_REF === `refs/tags/${tag}` && event.ref === process.env.GITHUB_REF;
          need(/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(pkg.version)
            && /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag)
            && tag === `v${pkg.version}` && lock.version === pkg.version && lock.packages?.['']?.version === pkg.version
            && /^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?\/[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$/.test(repo)
            && repo === process.env.GITHUB_REPOSITORY && process.env.GITHUB_SERVER_URL === 'https://github.com'
            && event.repository?.full_name === repo && event.repository?.private === false
            && (manual || automatic || tagged), 'Exact public GitHub release scope required.');
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          need(head === process.env.GITHUB_SHA, 'The build must use the validated commit.');
          if (automatic) need(event.ref === 'refs/heads/main' && event.head_commit?.id === process.env.GITHUB_SHA
            && typeof event.head_commit?.message === 'string'
            && event.head_commit.message.split(/\r?\n/, 1)[0] === `Release v${pkg.version}`, 'Automatic publication requires the exact release commit on main.');
          const directory = join('output', 'release', tag);
          const names = [`vortex-panel-${pkg.version}.zip`, 'SHA256SUMS', 'install.sh', 'release-manifest.json'];
          need(JSON.stringify(readdirSync(directory).sort()) === JSON.stringify([...names].sort()), 'Only the four reviewed release assets may be uploaded.');
          const expected = new Map(names.map(name => {
            const path = join(directory, name);
            const stat = lstatSync(path);
            need(stat.isFile() && !stat.isSymbolicLink() && stat.nlink === 1 && stat.size > 0, 'Regular release assets required.');
            const raw = readFileSync(path);
            return [name, { size: raw.length, digest: `sha256:${createHash('sha256').update(raw).digest('hex')}` }];
          }));
          const sums = String(readFileSync(join(directory, 'SHA256SUMS'), 'utf8')).trimEnd().split('\n');
          const checksumNames = new Set();
          need(sums.length === names.length - 1, 'Checksums must cover the ZIP, installer and manifest exactly.');
          for (const line of sums) {
            const match = /^([a-f0-9]{64})  ([A-Za-z0-9.-]+)$/.exec(line);
            need(match && match[2] !== 'SHA256SUMS' && !checksumNames.has(match[2])
              && expected.get(match[2])?.digest === `sha256:${match[1]}`, 'Current release bytes differ from their checksums.');
            checksumNames.add(match[2]);
          }
          const gh = (args, absent = false) => {
            const result = spawnSync('gh', args, { encoding: 'utf8', timeout: 120000, maxBuffer: 2 * 1024 * 1024 });
            if (absent && !result.error && result.status !== 0 && /^HTTP\/\S+ 404(?:\s|$)/m.test(result.stdout)) return null;
            need(!result.error && result.status === 0, 'GitHub CLI operation failed. Inspect the tag and any retained draft; no operation is retried.');
            return result.stdout;
          };
          const api = path => JSON.parse(gh(['api', path]));
          const releasePath = `repos/${repo}/releases/tags/${tag}`;
          const allReleases = () => {
            const rows = [];
            for (let page = 1; page <= 20; page++) {
              const batch = api(`repos/${repo}/releases?per_page=100&page=${page}`);
              need(Array.isArray(batch) && batch.length <= 100 && batch.every(row => row && Number.isSafeInteger(row.id)
                && row.id > 0 && typeof row.tag_name === 'string'), 'Release listing is invalid; refusing publication.');
              rows.push(...batch);
              if (batch.length < 100) return rows;
            }
            throw new Error('Release listing exceeded its page bound; inspect the repository before publication.');
          };
          need(api(`repos/${repo}`).private === false, 'Publication requires the approved public repository.');
          need(gh(['api', '--include', '--silent', releasePath], true) === null, 'A release already exists for this tag; it will not be overwritten.');
          // Tag lookup describes published releases. Authenticated listing also
          // includes drafts, which must never be mistaken for confirmed absence.
          need(!allReleases().some(row => row.tag_name === tag), 'A draft or published release already exists for this tag; inspect it instead of replaying creation.');
          const checkTag = () => need(api(`repos/${repo}/commits/${tag}`).sha === head, 'Remote tag changed; refusing publication.');
          if (gh(['api', '--include', '--silent', `repos/${repo}/git/ref/tags/${tag}`], true) === null) {
            need(manual || automatic, 'Only a maintainer dispatch or exact release commit on main can create a missing release tag.');
            // One explicit creation after tests and absence checks. A timeout or
            // lost acknowledgement stops; never retry a possibly completed write.
            gh(['api', '--method', 'POST', `repos/${repo}/git/refs`, '-f', `ref=refs/tags/${tag}`, '-f', `sha=${head}`]);
          }
          checkTag();
          const notes = join(process.env.RUNNER_TEMP, 'vortex-release-notes.md');
          writeFileSync(notes, `Vortex Panel ${pkg.version}\n\nMIT-licensed, self-hosted server management. Install the panel, create the initial administrator, and start managing servers.\n\nPanel updates use the local updater and existing authenticated worker connections, without VPS SSH passwords or private keys. The panel account password confirms administrator access. Workers installed before 0.24.1 need a one-time worker-installer upgrade to enable this API; future routine updates keep workers first and the main panel last. Interrupted updates retain their original request and are verified without replaying activation.\n\nThe control service requires security-patched Node.js 22.23.4+, 24.22.1+ or 26.12.1+ within those maintained major lines. The installer prepares its private control runtime when needed; saved application runtime versions are retained.\n\nARM64 hosts can create and run official Minecraft Bedrock Stable and Preview through a private, pinned Box64 compatibility runtime. Server network controls now also support native iptables with an existing netfilter-persistent setup, including Oracle Ubuntu images. Exact server TCP/UDP allowances are saved for reboot and removed through the same scoped controls; existing firewall policies and unrelated rules are retained. Full panel and agent installers prepare the runtime automatically on supported Ubuntu hosts with 4 KiB kernel pages, without changing system libraries or registering a global emulator. Existing Node.js and Python runtimes remain native and keep their saved versions.\n\nOlder ARM64 installations need the full installer once to add the Bedrock runtime. A source-only update preserves host dependencies and explains when runtime preparation is needed. The panel verifies the runtime receipt, architecture and hashes before creation or startup, and identifies Box64 execution in the interface.\n\nRelease gates validate native x64 and ARM64 production source, isolated native firewall TCP/UDP connectivity and persistence, full panel and worker installation, official Stable and Preview Bedrock creation/start/console/world persistence/live backup, cgroup CPU and RAM enforcement, application lifecycle, authenticated agent TLS, and HTTPS access. Real Minecraft client gameplay is not part of the automated checks.\n\nFresh public installations use https://IP:19191. Existing endpoints, accounts, workloads and data are retained during ordinary upgrades.\n\nAssets include the production source ZIP, checksums, release manifest and installer. Read README.md before installation.\n\nInstall or update on a supported Ubuntu host:\n\n\`\`\`sh\ncurl --proto '=https' --tlsv1.2 -fsSL https://github.com/${repo}/releases/latest/download/install.sh | sudo bash\n\`\`\`\n`, { flag: 'wx' });
          const creation = join(process.env.RUNNER_TEMP, 'vortex-release-create.json');
          writeFileSync(creation, JSON.stringify({ tag_name: tag, target_commitish: head, name: `Vortex Panel ${pkg.version}`,
            body: readFileSync(notes, 'utf8'), draft: true, prerelease: false }), { flag: 'wx' });
          // Capture the exact numeric release ID from the acknowledged POST.
          // Never look up an unpublished draft using the published-only tag API.
          const draft = JSON.parse(gh(['api', '--method', 'POST', `repos/${repo}/releases`,
            '--header', 'Content-Type: application/json', '--input', creation]));
          need(draft.draft === true && draft.tag_name === tag && draft.prerelease === false && Number.isSafeInteger(draft.id)
            && draft.id > 0 && draft.target_commitish === head && draft.assets?.length === 0, 'Expected a new empty draft release.');
          const releaseIdPath = `repos/${repo}/releases/${draft.id}`;
          const uploaded = new Map();
          const verify = (row, isDraft) => {
            need(row.id === draft.id && row.tag_name === tag && row.draft === isDraft && row.prerelease === false
              && row.assets?.length === uploaded.size, 'Release identity or asset count changed.');
            const seen = new Set();
            for (const asset of row.assets) {
              const local = expected.get(asset.name);
              need(local && !seen.has(asset.name) && uploaded.get(asset.name) === asset.id && asset.state === 'uploaded'
                && asset.size === local.size && asset.digest === local.digest, 'Uploaded asset identity, size or SHA256 differs. Draft will not be published.');
              seen.add(asset.name);
            }
          };
          verify(api(releaseIdPath), true);
          for (const name of names) {
            const asset = JSON.parse(gh(['api', '--method', 'POST',
              `https://uploads.github.com/repos/${repo}/releases/${draft.id}/assets?name=${encodeURIComponent(name)}`,
              '--header', 'Content-Type: application/octet-stream', '--input', join(directory, name)]));
            const local = expected.get(name);
            need(Number.isSafeInteger(asset.id) && asset.id > 0 && asset.name === name && asset.state === 'uploaded'
              && ![...uploaded.values()].includes(asset.id) && asset.size === local.size
              && asset.digest === local.digest, 'Upload acknowledgement differs; inspect the retained draft.');
            uploaded.set(name, asset.id);
            verify(api(releaseIdPath), true);
          }
          checkTag();
          const matching = allReleases().filter(row => row.tag_name === tag);
          need(matching.length === 1 && matching[0].id === draft.id, 'Another release now claims this tag; inspect retained drafts before publishing.');
          const publication = join(process.env.RUNNER_TEMP, 'vortex-release-publish.json');
          writeFileSync(publication, JSON.stringify({ draft: false, make_latest: 'true' }), { flag: 'wx' });
          verify(JSON.parse(gh(['api', '--method', 'PATCH', releaseIdPath,
            '--header', 'Content-Type: application/json', '--input', publication])), false);
          const published = api(releaseIdPath);
          verify(published, false);
          console.log(`Published verified release: ${published.html_url}`);
          NODE
